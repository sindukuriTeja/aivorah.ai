version: 2.1

# E2E tests do NOT live here. The canonical E2E suite is the aivorah-e2e-tests
# repo, and it runs on its OWN CircleCI project (not GitHub Actions - that
# repo's Actions billing/secrets setup is unreliable, confirmed by GitHub's
# secrets API rejecting even trivial values with a 400). This pipeline never
# runs Playwright directly. Once this repo's build passes, trigger-e2e finds
# this commit's live Vercel preview URL, then triggers a pipeline in
# aivorah-e2e-tests' own CircleCI project with that URL, which runs its smoke
# suite against it and reports the result back here as a commit status.

executors:
  node:
    docker:
      - image: cimg/node:22.11-browsers
    working_directory: ~/project

jobs:
  build_and_test:
    executor: node
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-deps-v1-{{ checksum "package-lock.json" }}
      - run:
          name: Install Dependencies
          command: npm ci
      - save_cache:
          key: npm-deps-v1-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
      - run:
          name: TypeScript check
          command: npx tsc --noEmit
      - run:
          name: Lint check
          command: npm run lint
      - run:
          name: Unit tests
          command: npm run test:unit -- --ci --maxWorkers=2
      - run:
          name: Integration tests
          command: npm run test:integration -- --ci --maxWorkers=2
      - run:
          name: Build Web Application
          command: npm run vercel-build

  trigger-e2e:
    executor: node
    steps:
      - run:
          name: Find this commit's Vercel preview URL, then dispatch to aivorah-e2e-tests
          command: |
            # Vercel's GitHub integration posts a Deployment + DeploymentStatus
            # for every commit it builds. Poll GitHub's Deployments API for it
            # instead of guessing the URL from a branch-name slug (Vercel's
            # slugging/truncation/collision rules aren't worth reimplementing).
            SHA="$CIRCLE_SHA1"
            REPO="aivorah24/aivorah-frontend"
            AUTH="Authorization: token $GH_DISPATCH_TOKEN"
            PREVIEW_URL=""

            for i in $(seq 1 30); do
              DEPLOYMENT_ID=$(curl -sf -H "$AUTH" \
                "https://api.github.com/repos/$REPO/deployments?sha=$SHA&environment=Preview" \
                | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8')); console.log(d[0] && d[0].id || '')" 2>/dev/null || true)

              if [ -n "$DEPLOYMENT_ID" ]; then
                PREVIEW_URL=$(curl -sf -H "$AUTH" \
                  "https://api.github.com/repos/$REPO/deployments/$DEPLOYMENT_ID/statuses" \
                  | node -e "
                      const s = JSON.parse(require('fs').readFileSync(0,'utf8'));
                      const ok = s.find(x => x.state === 'success' && x.environment_url);
                      console.log(ok ? ok.environment_url : '');
                    " 2>/dev/null || true)
                [ -n "$PREVIEW_URL" ] && break
              fi
              echo "[trigger-e2e] Vercel preview not ready yet (attempt $i/30), waiting 10s..."
              sleep 10
            done

            if [ -z "$PREVIEW_URL" ]; then
              echo "[trigger-e2e] No successful Vercel preview deployment found for $SHA after 5 minutes - skipping E2E dispatch (build/lint/unit/integration already gated this PR)."
              exit 0
            fi

            echo "[trigger-e2e] Preview URL: $PREVIEW_URL"
            echo "[trigger-e2e] Triggering a pipeline in aivorah-e2e-tests' CircleCI project..."
            curl -sf -X POST \
              -H "Circle-Token: $CIRCLECI_DISPATCH_TOKEN" \
              -H "Content-Type: application/json" \
              "https://circleci.com/api/v2/project/gh/aivorah24/aivorah-e2e-tests/pipeline" \
              -d "{\"branch\":\"main\",\"parameters\":{\"run_pr_preview_check\":true,\"base_url\":\"$PREVIEW_URL\",\"target_sha\":\"$SHA\",\"target_repo\":\"$REPO\"}}"
            echo "[trigger-e2e] Triggered. aivorah-e2e-tests will report a commit status back on $SHA when its run finishes."

workflows:
  version: 2
  ci:
    jobs:
      - build_and_test
      - trigger-e2e:
          requires:
            - build_and_test
