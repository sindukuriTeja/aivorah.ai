version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:20.11
    working_directory: ~/project

jobs:
  test:
    executor: node
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-deps-v1-{{ checksum "package-lock.json" }}
      - run:
          name: Install Dependencies
          command: npm ci
      - save_cache:
          key: npm-deps-v1-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
      - run:
          name: Syntax check
          command: node --check index.js
      - run:
          name: Run tests
          command: npm test -- --ci

workflows:
  version: 2
  ci:
    jobs:
      - test
