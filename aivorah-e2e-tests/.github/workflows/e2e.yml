          E2E_TEACHER_X: ${{ secrets.E2E_TEACHER_X }}
          E2E_TEACHER_Y: ${{ secrets.E2E_TEACHER_Y }}
          E2E_TEACHER_Z: ${{ secrets.E2E_TEACHER_Z }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      - name: Upload sessions + snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: e2e-session
          path: |
            .auth/**
            .profile-snapshot.json
          include-hidden-files: true
          retention-days: 1

  # -- 2. Test: the full suite, sharded across parallel CI jobs --
  # Each shard downloads the SAME sessions/snapshot the setup job already
  # produced (PLAYWRIGHT_SKIP_GLOBAL_HOOKS=true tells global-setup.js/
  # global-teardown.js not to redo that work) and runs its slice of the
  # suite in its own isolated runner. fullyParallel + Playwright's own
  # per-runner worker pool still applies within each shard.
  test:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium chrome
      - name: Download sessions + snapshot artifact
        uses: actions/download-artifact@v4
        with:
          name: e2e-session
      - name: Run this shard
        run: npx playwright test --shard=${{ matrix.shard }}/4 --reporter=blob ${{ github.event.inputs.testFilter != '' && format('--grep="{0}"', github.event.inputs.testFilter) || '' }}
        env:
          PLAYWRIGHT_SKIP_GLOBAL_HOOKS: 'true'
          B2B_ADMIN_EMAIL: ${{ secrets.B2B_ADMIN_EMAIL }}
          B2B_ADMIN_PASSWORD: ${{ secrets.B2B_ADMIN_PASSWORD }}
          B2B_PARENT_EMAIL: ${{ secrets.B2B_PARENT_EMAIL }}
          B2B_PARENT_PASSWORD: ${{ secrets.B2B_PARENT_PASSWORD }}
          B2B_STUDENT_EMAIL: ${{ secrets.B2B_STUDENT_EMAIL }}
          B2B_STUDENT_PASSWORD: ${{ secrets.B2B_STUDENT_PASSWORD }}
          B2B_TEACHER_EMAIL: ${{ secrets.B2B_TEACHER_EMAIL }}
          B2B_TEACHER_PASSWORD: ${{ secrets.B2B_TEACHER_PASSWORD }}
          E2E_ADMIN_A: ${{ secrets.E2E_ADMIN_A }}
          E2E_ADMIN_B: ${{ secrets.E2E_ADMIN_B }}
          E2E_ADMIN_C: ${{ secrets.E2E_ADMIN_C }}
          E2E_PARENT_A: ${{ secrets.E2E_PARENT_A }}
          E2E_PARENT_B: ${{ secrets.E2E_PARENT_B }}
          E2E_PARENT_C: ${{ secrets.E2E_PARENT_C }}
          E2E_PARENT_D: ${{ secrets.E2E_PARENT_D }}
          E2E_PARENT_E: ${{ secrets.E2E_PARENT_E }}
          E2E_PARENT_F: ${{ secrets.E2E_PARENT_F }}
          E2E_PARENT_F2: ${{ secrets.E2E_PARENT_F2 }}
          E2E_PARENT_F3: ${{ secrets.E2E_PARENT_F3 }}
          E2E_PARENT_F4: ${{ secrets.E2E_PARENT_F4 }}
          E2E_PARENT_F5: ${{ secrets.E2E_PARENT_F5 }}
          E2E_PARENT_F6: ${{ secrets.E2E_PARENT_F6 }}
          E2E_PARENT_F7: ${{ secrets.E2E_PARENT_F7 }}
          E2E_PARENT_G: ${{ secrets.E2E_PARENT_G }}
