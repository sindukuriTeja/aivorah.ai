name: E2E

# Manual trigger only - this suite hits real deployed infrastructure (the
# Vercel testing frontend, Render testing microservices, the aivorah-test
# Supabase project) and mutates real test-account data, so it runs on
# demand, not on every push/PR.
on:
  workflow_dispatch:
    inputs:
      shards:
        description: 'Number of parallel shards to split the suite across'
        required: false
        default: '4'
      testFilter:
        description: 'Optional Playwright --grep pattern to scope this run to specific spec(s), e.g. "My Kids"'
        required: false
        default: ''

env:
  # -- Testing environment targets (not secrets - public hostnames) --
  # Frontend: the Vercel branch-preview deployment for master, not
  # production (aivorah.ai). Backend: the same Render services confirmed
  # (via the Render API, 2026-08-26 investigation) to connect to the
  # aivorah-test Supabase project, not production - see that investigation
  # for how this was verified. The monolith (BACKEND_URL) has no separate
  # testing deployment; a handful of not-yet-migrated specs still need it.
  BASE_URL: https://aivorah-frontend-git-master-aivorah24-9470s-projects.vercel.app
  BACKEND_URL: https://aivorah.ai
  # E2E_PARENT_K plain (not a secret): repo already sits at GitHub's 100
  # combined-secrets-per-workflow-run ceiling (gh secret set returned 400
  # Bad Request confirming this), and a test account's email address isn't
  # sensitive on its own - the shared E2E_PASSWORD secret is what matters.
  E2E_PARENT_K: e2e.parent.k@aivorah.test
  SCHEDULE_SERVICE_URL: https://aivorah-schedule-service.onrender.com
  CHALLENGES_SERVICE_URL: https://aivorah-challenges-service.onrender.com
  LEADERBOARD_SERVICE_URL: https://aivorah-leaderboard-service.onrender.com
  ASSIGNMENTS_SERVICE_URL: https://aivorah-assignments-service.onrender.com
  PROFILE_SERVICE_URL: https://aivorah-profile-service.onrender.com
  TEACHER_DASHBOARD_SERVICE_URL: https://aivorah-teacher-dashboard-service.onrender.com
  LEARNING_PATHS_SERVICE_URL: https://aivorah-learning-paths-service.onrender.com
  STUDENTS_SERVICE_URL: https://aivorah-students-service.onrender.com
  DAILY_HABITS_SERVICE_URL: https://aivorah-daily-habits-service.onrender.com
  WORLD_AND_YOU_SERVICE_URL: https://aivorah-world-and-you-service.onrender.com
  AI_COACH_SERVICE_URL: https://aivorah-ai-coach-service.onrender.com
  BEDTIME_STORIES_SERVICE_URL: https://aivorah-bedtime-stories-service.onrender.com
  HELP_SERVICE_URL: https://aivorah-help-center-service.onrender.com
  AUTH_SERVICE_URL: https://aivorah-auth-service.onrender.com
  # CI runners (4-core/16GB standard GitHub-hosted) can safely raise these
  # beyond the 8GB-local-machine-conservative defaults baked into
  # tests/helpers/runSetup.js - see that file's comments for why the two
  # differ and why higher isn't free (the Render free-tier backend, not
  # local RAM, is the real ceiling on LOGIN_CONCURRENCY specifically).
  LOGIN_CONCURRENCY: '6'
  SNAPSHOT_CONCURRENCY: '15'

jobs:
  # -- 1. Setup: warm-up + resilient parallel login + profile snapshot, ONCE --
  # Runs before any shard so every shard starts from already-warm services
  # and already-logged-in sessions, instead of each shard redoing this
  # (which would be both wasteful and a race on the shared mutable test
  # accounts - see tests/helpers/runSetup.js's header comment).
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium chrome
      - name: Warm up services + log in every account + snapshot profiles
        run: node tests/ci/setup.mjs
        env:
          B2B_ADMIN_EMAIL: ${{ secrets.B2B_ADMIN_EMAIL }}
          B2B_ADMIN_PASSWORD: ${{ secrets.B2B_ADMIN_PASSWORD }}
          B2B_PARENT_EMAIL: ${{ secrets.B2B_PARENT_EMAIL }}
          B2B_PARENT_PASSWORD: ${{ secrets.B2B_PARENT_PASSWORD }}
          B2B_STUDENT_EMAIL: ${{ secrets.B2B_STUDENT_EMAIL }}
          B2B_STUDENT_PASSWORD: ${{ secrets.B2B_STUDENT_PASSWORD }}
          B2B_TEACHER_EMAIL: ${{ secrets.B2B_TEACHER_EMAIL }}
          B2B_TEACHER_PASSWORD: ${{ secrets.B2B_TEACHER_PASSWORD }}
          E2E_ADMIN_A: ${{ secrets.E2E_ADMIN_A }}
          E2E_ADMIN_B: ${{ secrets.E2E_ADMIN_B }}
          E2E_ADMIN_C: ${{ secrets.E2E_ADMIN_C }}
          E2E_PARENT_A: ${{ secrets.E2E_PARENT_A }}
          E2E_PARENT_B: ${{ secrets.E2E_PARENT_B }}
          E2E_PARENT_C: ${{ secrets.E2E_PARENT_C }}
          E2E_PARENT_D: ${{ secrets.E2E_PARENT_D }}
          E2E_PARENT_E: ${{ secrets.E2E_PARENT_E }}
          E2E_PARENT_F: ${{ secrets.E2E_PARENT_F }}
